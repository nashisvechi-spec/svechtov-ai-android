name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || (echo 'Android API 35 not installed' && exit 1)
          test -d "$ANDROID_HOME/build-tools/35.0.0" || (echo 'Android build-tools 35 missing' && exit 1)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SvechtovAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
